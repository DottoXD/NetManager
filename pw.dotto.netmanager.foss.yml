AutoName: NetManager

RepoType: git
Repo: https://github.com/DottoXD/NetManager.git
Binaries: https://github.com/DottoXD/NetManager/releases/download/%v/NetManager-FOSS.apk

Builds:
  - versionName: 0.1.2
    versionCode: 8
    commit: 1851ebd8b58ce6ee6c8c8f65e2c2b1b815a103ab
    output: build/app/outputs/flutter-apk/app-foss-release.apk
    srclibs:
      - flutter@3.44.8
    rm:
      - ios
      - linux
      - macos
      - test
      - web
      - windows
    prebuild:
      - git -C $$flutter$$ checkout -f 3.44.8
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export PATH=$$flutter$$/bin:$PATH
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scanignore:
      - $$flutter$$/packages/flutter_tools/gradle/flutter.gradle
      - $$flutter$$/bin/cache
    scandelete:
      - $$flutter$$
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export PATH=$$flutter$$/bin/:$PATH
      - export GIT_COMMIT=$(git rev-parse --short HEAD)
      - $$flutter$$/bin/flutter build apk --release --flavor foss --dart-define=SENTRY_DSN= --dart-define=flutter.flutter_map.unblockOSM= --dart-define=GIT_COMMIT=$GIT_COMMIT --dart-define=FOSS=true --target-platform android-arm,android-arm64

AllowedAPKSigningKeys: 7aef716f2bd8f1e1b9935ce64d5966b5d3060f4562a889ce7adfd8aab12350f6

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
