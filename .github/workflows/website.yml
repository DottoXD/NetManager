name: 🔨 Build & Deploy website to GitHub Pages

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]

permissions:
  contents: write
  actions: read
  pages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: startsWith(github.event.head_commit.message, "[website]")
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout
        uses: actions/checkout@v7.0.1

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: 🪛 Dependencies
        working-directory: website
        run: bun install --frozen-lockfile

      - name: 📝 Define GIT_COMMIT
        run: echo "GIT_COMMIT=$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV

      - name: 📦 Build Website
        working-directory: website
        run: bun run build

      - name: ✅ Add CNAME
        run: echo ${{ secrets.PAGES_DOMAIN }} > website/build/CNAME

      - name: 📤 Upload
        uses: actions/upload-artifact@v7.0.1
        with:
          path: ./website/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🦋 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5